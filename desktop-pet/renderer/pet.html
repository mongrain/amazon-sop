<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
    <title>小只工作宠物</title>
    <link rel="stylesheet" href="./pet.css">
</head>
<body>
    <div class="pet-shell">
        <button id="petBtn" class="pet-button" type="button" aria-label="打开工作聊天框">
            <span class="pet-shadow"></span>
            <canvas id="petCanvas" class="pet-canvas" aria-label="Chiikawa 3D 桌面宠物"></canvas>
            <span id="petStatus" class="pet-status" hidden></span>
            <span id="petDot" class="pet-dot hidden"></span>
        </button>
        <!-- <div id="petBubble" class="pet-bubble">点我记工作呀</div> -->
    </div>

    <script src="./pet.bundle.js"></script>
